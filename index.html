<style>
:root{--paper:#F5F1E8;--ink:#23201B;--sub:#7A7266;--rule:#DDD5C6;--card:#fff;--acc:#2F6E8A;--rest:#3D8A5A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:15px;line-height:1.6;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:1rem}
h1{font-size:1.2rem;margin:0 0 .8rem;letter-spacing:.1em}
[hidden]{display:none !important}
.panel{border:1px solid var(--rule);border-radius:6px;background:var(--card);margin:.7rem 0;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.45rem .75rem;border-bottom:1px solid var(--rule);background:#FAF8F3;font-weight:700;font-size:.88rem}
.panel-b{padding:.6rem .75rem}
.empty{color:var(--sub);font-size:.86rem}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:.4rem .9rem;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{padding:.2rem .6rem;font-size:.84rem;font-weight:400}
.linkbtn{border:none;background:none;color:var(--acc);cursor:pointer;padding:0;font-size:.84rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.f label{display:block;font-size:.76rem;color:var(--sub);margin-bottom:.15rem}
.f input,.f select{width:100%;border:1px solid var(--rule);border-radius:4px;padding:.4rem .5rem;background:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.5rem}
.status{font-size:.84rem;color:var(--sub)}.status.err{color:#B3283C}
.fig{width:100%;background:#FBFAF6;border:1px solid var(--rule);border-radius:10px;touch-action:none}
.fig .bone{stroke:var(--ink);stroke-width:10;stroke-linecap:round;fill:none}
.fig .far{stroke:#A8A093}.fig .headc{fill:var(--ink)}.fig .ground{stroke:var(--rule);stroke-width:2}
.fig .h{fill:#fff;stroke:var(--acc);stroke-width:2.5;cursor:grab}.fig .h.root{stroke:#B3283C}
.fig .prop rect{fill:#D9D0BE}.fig .ph{fill:#E8A23A;stroke:#fff;stroke-width:1.5;cursor:move}.fig .pin{fill:none;stroke:#B3283C;stroke-width:2.5;stroke-dasharray:3 2}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem}
.mcard{border:1px solid var(--rule);border-radius:8px;background:#fff;padding:.3rem;cursor:pointer;text-align:center}
.mcard svg{width:100%;height:auto;background:none;border:none}.mcard b{font-size:.84rem;display:block}.mcard small{color:var(--sub);font-size:.72rem}
.item{display:grid;grid-template-columns:3.2rem 1fr auto;gap:.5rem;align-items:center;border-top:1px dashed var(--rule);padding:.4rem 0}

.item .iset input,.item .iset select{width:4.2rem;border:1px solid var(--rule);border-radius:4px;padding:.15rem .3rem}

.player .now{text-align:center}.player .now .nm{font-size:1.7rem;font-weight:700}

.player .sub2{color:var(--sub);font-size:.9rem}
.player.rest .nm{color:var(--rest)}.player .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:.5rem 0}.player .bar i{display:block;height:100%;background:var(--acc)}
.player.rest .bar i{background:var(--rest)}
.player .ctl{display:flex;gap:.6rem;justify-content:center;margin-top:.6rem}
.player .ctl button{border:1px solid var(--rule);background:#fff;border-radius:50%;width:3.4rem;height:3.4rem;font-size:1.2rem;cursor:pointer}
.player .ctl button.main{width:4.2rem;height:4.2rem;background:var(--ink);color:#fff;border-color:var(--ink)}

<body>
<div class="wrap">
  <section class="view" id="view-menus"><div id="menus"></div></section>
  <section class="view" id="view-moves" hidden><div id="moves"></div></section>
  <section class="view" id="view-settings" hidden>
    <h1>設定</h1>
    <div class="panel"><div class="panel-h">声の案内</div><div class="panel-b">
      <label class="row"><input type="checkbox" id="voice-on"> 声で案内する(次の動作・あと3秒・休憩)</label>
      <div class="row" style="margin-top:.4rem"><span class="status">速さ</span><input type="range" id="voice-rate" min="0.7" max="1.5" step="0.1" style="flex:1"><button class="btn ghost sm" type="button" id="voice-test">試しに話す</button></div>
    </div></div>
    <div class="panel"><div class="panel-h">接続</div><div class="panel-b">
      <p class="empty" style="margin-top:0">行軍表・省アプリと同じトークンが使えます(同じ端末で入れてあれば自動で使います)。</p>
      <div class="grid2"><div class="f"><label>ユーザー名</label><input id="c-owner"></div><div class="f"><label>リポジトリ</label><input id="c-repo"></div><div class="f"><label>ブランチ</label><input id="c-branch"></div></div>
      <div class="f" style="margin-top:.4rem"><label>トークン</label><input id="c-token" type="password"></div>
      <div class="row" style="margin-top:.6rem"><button class="btn" id="connect" type="button">接続して読み込む</button><span class="status" id="conn-status"></span></div>

<script>
(function(){
"use strict";
const APP_VERSION = "2026-10-07 r2";
const DATA = "roadmap/apps/tanren/data.json";
const KEY_CONN = "tn-conn", KEY_CACHE = "tn-cache", KEY_VOICE = "tn-voice";
const state = { conn: null, doc: null, sha: null, view: "menus", editMenu: null, picker: false, editMove: null, frame: 0, preview: true, play: null };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => window.__tnToday || new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);
const nowMs = () => window.__tnNow ? window.__tnNow() : performance.now();
const say = (t, err) => { const el = document.getElementById("msg"); el.textContent = t; el.classList.toggle("err", !!err); };
const emptyDoc = () => ({ version: 1, moves: [], menus: [], runs: [] });

/* ───────── 人の骨組み:関節の角度だけで描く(0=上、90=右、180=下、270=左) ───────── */
const SEG = { torso: 51, neck: 12, head: 11, uarm: 33, farm: 30, thigh: 44, shin: 43, foot: 13 };
const GROUND = 212, W = 320, H = 240;
const R = x => x * Math.PI / 180;
const vec = (g, l) => [Math.sin(R(g)) * l, -Math.cos(R(g)) * l];
const add = (a, g, l) => { const v = vec(g, l); return [a[0] + v[0], a[1] + v[1]]; };
const ANG = ["c", "c2", "n", "d1", "e1", "d2", "e2", "f1", "g1", "f2", "g2", "h1", "h2"];
// 前の形のポーズ(胸・首・足首が無い)は、まっすぐつながっているものとして読む
function norm(p){ const q = Object.assign({}, p); if (q.c2 == null) q.c2 = q.c; if (q.n == null) q.n = q.c2; if (q.h1 == null) q.h1 = 90; if (q.h2 == null) q.h2 = 90; return q; }
function joints(p){
  p = norm(p);
  const P = [p.px, p.py], M = add(P, p.c, SEG.torso * 0.45), S = add(M, p.c2, SEG.torso * 0.55), Hd = add(S, p.n, SEG.neck + SEG.head);
  const E1 = add(S, p.d1, SEG.uarm), W1 = add(E1, p.e1, SEG.farm), E2 = add(S, p.d2, SEG.uarm), W2 = add(E2, p.e2, SEG.farm);
  const K1 = add(P, p.f1, SEG.thigh), A1 = add(K1, p.g1, SEG.shin), K2 = add(P, p.f2, SEG.thigh), A2 = add(K2, p.g2, SEG.shin);
  const T1 = add(A1, p.h1, SEG.foot), T2 = add(A2, p.h2, SEG.foot);
  return { P, M, S, H: Hd, E1, W1, E2, W2, K1, A1, K2, A2, T1, T2 };
}
// 腕・脚の先を、決めた点に届かせる(曲げる向きは今の形のまま)
const LIMB = { W1: ["S", "d1", "e1", "uarm", "farm", "E1"], W2: ["S", "d2", "e2", "uarm", "farm", "E2"], A1: ["P", "f1", "g1", "thigh", "shin", "K1"], A2: ["P", "f2", "g2", "thigh", "shin", "K2"] };
const angTo = (a, b) => ((Math.atan2(b[0] - a[0], -(b[1] - a[1])) * 180 / Math.PI) + 360) % 360;
function ikTo(p, key, T){
  const L = LIMB[key]; if (!L) return p;
  const q = Object.assign({}, p), j = joints(q), Rt = j[L[0]], l1 = SEG[L[3]], l2 = SEG[L[4]];
  const dx = T[0] - Rt[0], dy = T[1] - Rt[1], d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(l1 + l2 - 0.01, Math.hypot(dx, dy)));
  const th = angTo(Rt, T), al = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)))) * 180 / Math.PI;
  const mid = j[L[5]], end = j[key], cross = (end[0] - Rt[0]) * (mid[1] - Rt[1]) - (end[1] - Rt[1]) * (mid[0] - Rt[0]);
  const sg = cross >= 0 ? 1 : -1;
  q[L[1]] = (th + sg * al + 360) % 360;
  const m2 = add(Rt, q[L[1]], l1); q[L[2]] = angTo(m2, T);
  return q;
}
// 足(または腰)を地面につける。横向きでは、つま先も地面につく点に数える
function plant(p, how, view){
  const q = norm(p);
  if (how && how.mode === "pelvis") { q.py = GROUND - 10; if (how.px != null) q.px = how.px; return q; }
  let j = joints(q);
  const pts = [j.A1, j.A2].concat(view === "front" ? [] : [j.T1, j.T2]);
  q.py += GROUND - Math.max.apply(null, pts.map(x => x[1]));
  if (how && how.ax != null) { j = joints(q); q.px += how.ax - j.A1[0]; }
  if (q.lift) q.py -= q.lift;
  return q;
}
// 動作の中での置き方:固定した関節があればそれに合わせ、無ければ地面につける
function place(p, move){
  const pins = move.pins || {}, keys = Object.keys(pins);
  if (!keys.length) return plant(p, move.plant, move.view);
  let q = norm(p), j = joints(q);
  q.px += pins[keys[0]][0] - j[keys[0]][0]; q.py += pins[keys[0]][1] - j[keys[0]][1];
  keys.slice(1).forEach(k => { q = ikTo(q, k, pins[k]); });
  return q;
}
const line = (a, b, cls) => '<line class="bone' + (cls ? " " + cls : "") + '" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '"/>';
// 置く物:椅子・台・壁・マット・棒
const PROPS = { chair: "椅子", box: "台", wall: "壁", mat: "マット", bar: "棒" };
function propSvg(o){
  const x = o.x, y = o.y, w = o.w || 50, h = o.h || 40;
  if (o.type === "chair") return '<g class="prop"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="6" rx="2"/><rect x="' + (x + 2) + '" y="' + (y + 6) + '" width="5" height="' + (GROUND + 2 - y - 6) + '"/><rect x="' + (x + w - 7) + '" y="' + (y + 6) + '" width="5" height="' + (GROUND + 2 - y - 6) + '"/><rect x="' + (x + 2) + '" y="' + (y - h) + '" width="5" height="' + h + '"/></g>';
  if (o.type === "box") return '<g class="prop"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + (GROUND + 2 - y) + '" rx="3"/></g>';
  if (o.type === "wall") return '<g class="prop"><rect x="' + x + '" y="0" width="' + (o.w || 10) + '" height="' + (GROUND + 2) + '"/></g>';
  if (o.type === "mat") return '<g class="prop"><rect x="' + x + '" y="' + (GROUND - 3) + '" width="' + w + '" height="5" rx="2"/></g>';
  if (o.type === "bar") return '<g class="prop"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="5" rx="2"/></g>';
  return "";
}
function figureSvg(p, view, opts){
  opts = opts || {};
  const j = joints(p), side = view !== "front", far = side ? "far" : "";
  let h = '<svg viewBox="0 0 ' + W + " " + H + '" class="fig"' + (opts.id ? ' id="' + opts.id + '"' : "") + ' role="img" aria-label="動作">' +
    '<line class="ground" x1="8" y1="' + (GROUND + 2) + '" x2="' + (W - 8) + '" y2="' + (GROUND + 2) + '"/>' + (opts.props || []).map(propSvg).join("") +
    line(j.S, j.E2, far) + line(j.E2, j.W2, far) + line(j.P, j.K2, far) + line(j.K2, j.A2, far) + (side ? line(j.A2, j.T2, far) : "") +
    line(j.P, j.M) + line(j.M, j.S) + line(j.P, j.K1) + line(j.K1, j.A1) + (side ? line(j.A1, j.T1) : "") + line(j.S, j.E1) + line(j.E1, j.W1) +
    '<circle class="headc" cx="' + j.H[0].toFixed(1) + '" cy="' + j.H[1].toFixed(1) + '" r="' + SEG.head + '"/>';
  if (opts.handles) {
    const pins = opts.pins || {}, ks = ["P", "M", "S", "H", "E1", "W1", "E2", "W2", "K1", "A1", "K2", "A2"].concat(side ? ["T1", "T2"] : []);
    h += (opts.props || []).map((o, i) => '<rect class="ph" data-prop="' + i + '" x="' + (o.x - 6) + '" y="' + ((o.type === "wall" ? 100 : o.type === "mat" ? GROUND - 6 : o.y) - 6) + '" width="12" height="12" transform="rotate(45 ' + o.x + " " + (o.type === "wall" ? 100 : o.type === "mat" ? GROUND - 6 : o.y) + ')"/>').join("");
    h += ks.map(k => { const v = j[k]; return (pins[k] ? '<rect class="pin" x="' + (v[0] - 10) + '" y="' + (v[1] - 10) + '" width="20" height="20" rx="3"/>' : "") +
      '<circle class="h' + (k === "P" ? " root" : "") + '" data-j="' + k + '" cx="' + v[0].toFixed(1) + '" cy="' + v[1].toFixed(1) + '" r="' + (k === "P" ? 9 : 7) + '"/>'; }).join("");
  }
  return h + "</svg>";
}
// ポーズのあいだをなめらかにつなぐ(角度は近いほうに回る)
function lerpPose(a, b, k){
  a = norm(a); b = norm(b); const o = {};
  for (const key of ANG) { let dlt = ((b[key] - a[key]) % 360 + 540) % 360 - 180; o[key] = a[key] + dlt * k; }
  o.px = a.px + (b.px - a.px) * k; o.py = a.py + (b.py - a.py) * k; o.lift = (a.lift || 0) + ((b.lift || 0) - (a.lift || 0)) * k;
  return o;
}
function poseAt(move, t){
  const fr = move.frames.map(f => place(f, move)), n = fr.length;
  let p;
  if (n === 1) p = fr[0];
  else if (n === 2) p = lerpPose(fr[0], fr[1], (1 - Math.cos(t * 2 * Math.PI)) / 2);
  else { const pos = ((t % 1) + 1) % 1 * n, i = Math.floor(pos), loc = pos - i; p = lerpPose(fr[i], fr[(i + 1) % n], (1 - Math.cos(Math.PI * loc)) / 2); }
  return Object.keys(move.pins || {}).length ? place(p, move) : p;      // つないだ途中でも、固定した関節は動かさない
}

/* ───────── 用意した動作 ───────── */
const ST = { c: 0, d1: 180, e1: 180, d2: 180, e2: 180, f1: 180, g1: 180, f2: 180, g2: 180, px: 160, py: 125 };
const P_ = o => Object.assign({}, ST, o);
const BUILTIN = [
  { id: "b:squat", name: "スクワット", view: "side", sec: 2.4, plant: { ax: 170 }, frames: [P_({ d1: 90, e1: 90, d2: 90, e2: 90 }), P_({ c: 38, f1: 100, g1: 200, f2: 100, g2: 200, d1: 95, e1: 95, d2: 95, e2: 95 })] },
  { id: "b:pushup", name: "腕立て伏せ", view: "side", sec: 2.6, plant: { ax: 70 }, frames: [P_({ c: 62, f1: 240, g1: 240, f2: 240, g2: 240, d1: 185, e1: 185, d2: 185, e2: 185, h1: 175, h2: 175 }), P_({ c: 74, f1: 252, g1: 252, f2: 252, g2: 252, d1: 222, e1: 140, d2: 222, e2: 140, h1: 175, h2: 175 })] },
  { id: "b:plank", name: "プランク", view: "side", sec: 3, hold: true, plant: { ax: 70 }, frames: [P_({ c: 78, f1: 256, g1: 256, f2: 256, g2: 256, d1: 180, e1: 92, d2: 180, e2: 92, h1: 175, h2: 175 })] },
  { id: "b:bend", name: "前屈ストレッチ", view: "side", sec: 4, plant: { ax: 160 }, frames: [P_({}), P_({ c: 118, f1: 168, g1: 180, f2: 168, g2: 180, d1: 170, e1: 172, d2: 170, e2: 172 })] },
  { id: "b:lunge", name: "ランジ", view: "side", sec: 2.8, plant: { ax: 190 }, frames: [P_({ f1: 165, g1: 180, f2: 195, g2: 180 }), P_({ f1: 100, g1: 185, f2: 215, g2: 262 })] },
  { id: "b:calf", name: "カーフレイズ", view: "side", sec: 2, plant: { ax: 160 }, frames: [P_({}), P_({ h1: 150, h2: 150 })] },
  { id: "b:knee", name: "もも上げ", view: "side", sec: 1.6, plant: {}, frames: [P_({ f1: 95, g1: 180, d1: 150, e1: 120, d2: 210, e2: 200 }), P_({}), P_({ f2: 95, g2: 180, d2: 150, e2: 120, d1: 210, e1: 200 }), P_({})] },
  { id: "b:crunch", name: "腹筋(クランチ)", view: "side", sec: 2.4, plant: { mode: "pelvis", px: 150 }, frames: [P_({ c: 280, d1: 100, e1: 100, d2: 100, e2: 100, f1: 35, g1: 150, f2: 35, g2: 150 }), P_({ c: 308, d1: 75, e1: 75, d2: 75, e2: 75, f1: 35, g1: 150, f2: 35, g2: 150 })] },
  { id: "b:sitreach", name: "長座前屈", view: "side", sec: 5, plant: { mode: "pelvis", px: 105 }, props: [{ type: "mat", x: 60, y: 200, w: 200 }],

function b64e(str){ const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }

const repo = () => "https://api.github.com/repos/" + encodeURIComponent(state.conn.owner) + "/" + encodeURIComponent(state.conn.repo);
const hdr = x => Object.assign({ "Authorization": "Bearer " + state.conn.token, "Accept": "application/vnd.github+json" }, x || {});
async function fetchRetry(url, opts){ let last; for (let i = 0; i < 3; i++) { try { return await fetch(url, opts); } catch (e) { last = e; await new Promise(r => setTimeout(r, 500 * (i + 1))); } } throw last; }

async function readJson(path){
  const url = repo() + "/contents/" + path + "?ref=" + encodeURIComponent(state.conn.branch);
  const r = await fetchRetry(url, { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw httpErr(r.status, path);
  const meta = await r.json();
  let text = meta.content ? b64d(meta.content) : null;
  if (text == null) text = await (await fetchRetry(url, { headers: hdr({ "Accept": "application/vnd.github.raw+json" }), cache: "no-store" })).text();
  return { data: JSON.parse(text), sha: meta.sha };
}
async function writeJson(path, obj, sha, msg){
  const body = { message: msg || "思案を更新", content: b64e(JSON.stringify(obj, null, 1)), branch: state.conn.branch };
  if (sha) body.sha = sha;
  const r = await fetchRetry(repo() + "/contents/" + path, { method: "PUT", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
  if (!r.ok) throw httpErr(r.status, path);
  return (await r.json()).content.sha;
}
async function load(){

  catch (e) { say(e.message, true); return false; }
}
async function commit(mutate){
  mutate(state.doc); lsSet(KEY_CACHE, { doc: state.doc, sha: state.sha }); render();
  if (!state.conn || !state.conn.token) return true;
  for (let i = 0; i < 3; i++) {
    try { state.sha = await writeJson(DATA, state.doc, state.sha); lsSet(KEY_CACHE, { doc: state.doc, sha: state.sha }); return true; }
    catch (e) { if ((e.status === 409 || e.status === 422) && i < 2) { const f = await readJson(DATA); state.doc = Object.assign(emptyDoc(), f.data || {}); state.sha = f.sha; mutate(state.doc); continue; } say(e.message, true); return false; }

function buildSegs(mn){
  const segs = [], its = mn.items.filter(it => moveOf(it.move));
  if (!its.length) return segs;
  segs.push({ kind: "prep", dur: 5, next: its[0] });
  its.forEach((it, i) => {
    for (let s = 1; s <= it.sets; s++) {
      segs.push({ kind: "move", it, set: s, dur: itemSec(it) });
      const lastAll = i === its.length - 1 && s === it.sets;
      const nextIt = s < it.sets ? it : its[i + 1];
      if (!lastAll && (it.rest || 0) > 0) segs.push({ kind: "rest", dur: it.rest, next: nextIt, nextSet: s < it.sets ? s + 1 : 1 });
    }
  });
  return segs;
}

  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { state.play && (state.play.lock = l); }).catch(() => {}); } catch (e) {}

    '<div class="now"><div class="nm">' + (seg.kind === "prep" ? "準備" : seg.kind === "rest" ? "休憩" : esc(m.name)) + "</div>" +
    '<div class="big" id="pl-big"></div><div class="sub2" id="pl-sub"></div><div class="bar"><i id="pl-bar" style="width:0%"></i></div>' +
    '<div class="sub2">' + (seg.kind === "move" ? (nxt ? "次:" + esc(segName(nxt)) : "これで最後") : "次:" + esc(m.name) + (seg.kind === "rest" && seg.nextSet > 1 ? "(" + seg.nextSet + "セット目)" : "")) + "</div></div>" +

function tickPlayer(){

  const fig = document.getElementById("pl-stage");
  if (fig) fig.innerHTML = figureSvg(poseAt(m, seg.kind === "move" && !m.hold ? t / m.sec : (seg.kind === "move" ? 0 : t / (m.sec * 1.6))), m.view, { id: "pl-fig", props: m.props });

    if (big) big.textContent = "あと " + rem + " 回"; if (sub) sub.textContent = done + " / " + seg.it.value + " 回" + (seg.it.sets > 1 ? "・" + seg.set + "/" + seg.it.sets + "セット" : "");

  } else {
    if (big) big.textContent = fmt(Math.ceil(left)); if (sub) sub.textContent = seg.kind === "move" && seg.it.sets > 1 ? seg.set + "/" + seg.it.sets + "セット" : "";

  }

function goSeg(i){
  const pl = state.play; if (!pl) return;
  if (i >= pl.segs.length) { pl.done = true; speak("おつかれさまでした"); releaseLock(); renderPlayer();
    commit(doc => { doc.runs = (doc.runs || []).concat([{ menu: pl.mn.id, date: today(), sec: Math.round(pl.total) }]).slice(-200); }); return; }
  pl.i = Math.max(0, i); pl.start = nowMs(); if (pl.paused != null) pl.paused = pl.start; enterSeg();
}
function releaseLock(){ try { state.play && state.play.lock && state.play.lock.release(); } catch (e) {} }
function loop(){ if (!state.play || state.play.done) return; tickPlayer(); state.raf = requestAnimationFrame(loop); }

/* ───────── 動作を作る画面のアニメーションとドラッグ ───────── */
function previewLoop(ts){
  if (state.editMove && state.preview && state.view === "moves") { const st = document.getElementById("mv-stage"), m = state.editMove; if (st) st.innerHTML = figureSvg(poseAt(m, (nowMs() / 1000) / m.sec), m.view, { id: "mv-fig", props: m.props }); }
  requestAnimationFrame(previewLoop);
}
const PARENT = { M: ["P", "c"], S: ["M", "c2"], H: ["S", "n"], E1: ["S", "d1"], W1: ["E1", "e1"], E2: ["S", "d2"], W2: ["E2", "e2"], K1: ["P", "f1"], A1: ["K1", "g1"], K2: ["P", "f2"], A2: ["K2", "g2"], T1: ["A1", "h1"], T2: ["A2", "h2"] };

  const placed = place(fr, m), j = joints(placed);
  if (jk === "P") { fr.px += pt[0] - j.P[0]; fr.py += pt[1] - j.P[1]; return; }
  const [par, key] = PARENT[jk];

  fr[key] = Math.round(angTo(j[par], pt));
}
function togglePin(jk){
  const m = state.editMove, j = joints(place(m.frames[state.frame], m));
  m.pins = Object.assign({}, m.pins || {});
  if (m.pins[jk]) delete m.pins[jk];
  else { if (Object.keys(m.pins).length && !LIMB[jk]) return say("2つ目からは、手首か足首だけ固定できます(腕・脚を曲げて届かせます)。", true); m.pins[jk] = [Math.round(j[jk][0]), Math.round(j[jk][1])]; }
  say("");
}
function editStage(m){
  const builtin = m.id && m.id.startsWith("b:"), fr = m.frames[state.frame] || m.frames[0];
  return state.preview ? figureSvg(poseAt(m, 0), m.view, { id: "mv-fig", props: m.props }) : figureSvg(place(fr, m), m.view, { id: "mv-fig", handles: !builtin, pins: m.pins, props: m.props });
}
function readMove(m){
  const v = id => (document.getElementById(id) || {}).value;
  if (document.getElementById("mv-name")) { m.name = (v("mv-name") || "").trim(); m.view = v("mv-view"); m.sec = Math.max(0.5, +v("mv-sec") || 2); m.plant = v("mv-plant") === "pelvis" ? { mode: "pelvis" } : {}; }
}
const clone = o => JSON.parse(JSON.stringify(o));

/* ───────── 描画と操作 ───────── */
function render(){ if (!D()) state.doc = emptyDoc(); renderMenus(); renderMoves(); }
function show(v){
  state.view = v;
  document.querySelectorAll(".view").forEach(el => el.hidden = el.id !== "view-" + v);
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
}
function bind(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
  document.getElementById("menus").addEventListener("click", async e => {
    const q = s => e.target.closest(s); let b;
    if (q("[data-mnew]")) { state.editMenu = { id: uid(), name: "", items: [] }; state.picker = true; return renderMenus(); }
    if ((b = q("[data-medit]"))) { state.editMenu = clone(D().menus.find(x => x.id === b.dataset.medit)); state.picker = false; return renderMenus(); }
    if ((b = q("[data-mdel]"))) { if (!confirm("このメニューを消しますか。")) return; const id = b.dataset.mdel; return commit(doc => { doc.menus.find(x => x.id === id).deleted = today(); }); }
    if ((b = q("[data-play]"))) { const mn = D().menus.find(x => x.id === b.dataset.play); return startPlay(mn); }
    const mn = state.editMenu; if (!mn) return;
    readMenu(mn);
    if (q("[data-padd]")) { state.picker = true; return renderMenus(); }
    if (q("[data-pick-x]")) { state.picker = false; return renderMenus(); }
    if ((b = q("[data-pick]"))) { const m = moveOf(b.dataset.pick); mn.items.push({ move: m.id, mode: m.hold ? "time" : "reps", value: m.hold ? 30 : 10, sets: 1, rest: 15 }); state.picker = false; return renderMenus(); }
    if ((b = q("[data-idel]"))) { mn.items.splice(+b.dataset.idel, 1); return renderMenus(); }
    if ((b = q("[data-iup]"))) { const i = +b.dataset.iup; if (i > 0) [mn.items[i - 1], mn.items[i]] = [mn.items[i], mn.items[i - 1]]; return renderMenus(); }
    if ((b = q("[data-idown]"))) { const i = +b.dataset.idown; if (i < mn.items.length - 1) [mn.items[i + 1], mn.items[i]] = [mn.items[i], mn.items[i + 1]]; return renderMenus(); }
    if (q("[data-mcancel]")) { state.editMenu = null; return renderMenus(); }
    if (q("[data-msave]")) {
      if (!mn.name) return say("名前を入れてください。", true);
      if (!mn.items.length) return say("動作を1つ以上足してください。", true);
      state.editMenu = null; say("保存しました");
      return commit(doc => { const i = doc.menus.findIndex(x => x.id === mn.id); if (i >= 0) doc.menus[i] = mn; else doc.menus.push(mn); });
    }
  });
  document.getElementById("moves").addEventListener("change", e => {
    if (e.target.id !== "mv-prop-type" || !state.editMove || !e.target.value) return;
    const m = state.editMove, t = e.target.value; readMove(m);
    m.props = (m.props || []).concat([{ type: t, x: t === "wall" ? 250 : t === "mat" ? 60 : 100, y: t === "chair" ? 172 : t === "box" ? 180 : t === "bar" ? 60 : 0, w: t === "wall" ? 10 : t === "mat" ? 200 : t === "chair" ? 46 : 60, h: 44 }]);
    renderMoves();
  });
  document.getElementById("menus").addEventListener("change", e => { if (state.editMenu && e.target.closest("[data-it]")) { readMenu(state.editMenu); renderMenus(); } });
  document.getElementById("moves").addEventListener("click", async e => {
    const q = s => e.target.closest(s); let b;
    if ((b = q("[data-mopen]"))) { state.editMove = clone(moveOf(b.dataset.mopen)); state.frame = 0; state.preview = true; return renderMoves(); }
    if (q("[data-mvnew]")) { state.editMove = { id: "c:" + uid(), name: "", view: "side", sec: 2.5, plant: {}, frames: [clone(ST), Object.assign(clone(ST), { d1: 90, e1: 90, d2: 90, e2: 90 })] }; state.frame = 0; state.preview = false; return renderMoves(); }
    const m = state.editMove; if (!m) return;
    readMove(m);
    if (q("[data-mvclose]")) { state.editMove = null; return renderMoves(); }
    if (q("[data-mvcopy]")) { const c = clone(m); c.id = "c:" + uid(); c.name = m.name + "(自分用)"; delete c.hold; state.editMove = c; state.frame = 0; state.preview = false; return renderMoves(); }
    if ((b = q("[data-frame]"))) { state.frame = +b.dataset.frame; state.preview = false; return renderMoves(); }
    if (q("[data-preview]")) { state.preview = !state.preview; state.pinMode = false; return renderMoves(); }
    if (q("[data-pinmode]")) { state.pinMode = !state.pinMode; return renderMoves(); }
    if ((b = q("[data-prop-del]"))) { m.props.splice(+b.dataset.propDel, 1); return renderMoves(); }
    if (q("[data-fadd]")) { m.frames.splice(state.frame + 1, 0, clone(m.frames[state.frame])); state.frame++; state.preview = false; return renderMoves(); }
    if (q("[data-fdel]")) { if (m.frames.length > 1) { m.frames.splice(state.frame, 1); state.frame = Math.max(0, state.frame - 1); } return renderMoves(); }
    if (q("[data-mvdel]")) { if (!confirm("この動作を消しますか。")) return; const id = m.id; state.editMove = null; return commit(doc => { doc.moves.find(x => x.id === id).deleted = today(); }); }
    if (q("[data-mvsave]")) {
      if (!m.name) return say("名前を入れてください。", true);
      const keep = clone(m); state.editMove = null; say("保存しました");
      return commit(doc => { const i = doc.moves.findIndex(x => x.id === keep.id); if (i >= 0) doc.moves[i] = keep; else doc.moves.push(keep); });
    }
  });
  // 関節をドラッグ
  let drag = null;
  document.getElementById("moves").addEventListener("pointerdown", e => {
    if (!state.editMove || state.preview) return;
    const ph = e.target.closest(".ph"); if (ph) { drag = "prop:" + ph.dataset.prop; e.preventDefault(); return; }
    const h = e.target.closest(".h"); if (!h) return;
    if (state.pinMode) { togglePin(h.dataset.j); document.getElementById("mv-stage").innerHTML = editStage(state.editMove); e.preventDefault(); return; }
    drag = h.dataset.j; e.preventDefault(); });
  document.addEventListener("pointermove", e => { if (!drag) return; const svg = document.getElementById("mv-fig"); if (!svg) return; const pt = svgPoint(svg, e), m = state.editMove;
    if (drag.startsWith("prop:")) { const o = m.props[+drag.slice(5)]; o.x = Math.round(pt[0]); if (o.type !== "wall" && o.type !== "mat") o.y = Math.round(pt[1]); }
    else dragTo(drag, pt);
    document.getElementById("mv-stage").innerHTML = editStage(m); });
  document.addEventListener("pointerup", () => { drag = null; });
  document.getElementById("player").addEventListener("click", e => {
    const b = e.target.closest("[data-pl]"); if (!b || !state.play) return;
    const pl = state.play, k = b.dataset.pl;
    if (k === "pause") { if (pl.paused != null) { pl.start += nowMs() - pl.paused; pl.paused = null; speak("再開"); } else { pl.paused = nowMs(); } return renderPlayer(); }
    if (k === "next") return goSeg(pl.i + 1);
    if (k === "prev") return goSeg(pl.i - 1);
    if (k === "stop") { if (!confirm("やめますか。")) return; try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (err) {} releaseLock(); state.play = null; return renderPlayer(); }

  document.getElementById("voice-on").addEventListener("change", e => lsSet(KEY_VOICE, Object.assign(voice(), { on: e.target.checked })));
  document.getElementById("voice-rate").addEventListener("change", e => lsSet(KEY_VOICE, Object.assign(voice(), { rate: +e.target.value })));
  document.getElementById("voice-test").addEventListener("click", () => speak("次はスクワット、10回。あと3秒"));
  document.getElementById("connect").addEventListener("click", async () => {
    const g = id => document.getElementById(id).value.trim();
    state.conn = { owner: g("c-owner"), repo: g("c-repo"), branch: g("c-branch") || "main", token: g("c-token") };
    lsSet(KEY_CONN, state.conn); document.getElementById("conn-status").textContent = (await load()) ? "読み込みました" : "";
  });
}
function boot(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  bind();
  document.getElementById("ver").textContent = "版 " + APP_VERSION;
  const c = lsGet(KEY_CONN, null) || lsGet("roadmap-conn", null) || lsGet("sho-conn", null) || lsGet("shian-conn", null) || lsGet("mr-conn", null);
  document.getElementById("c-owner").value = c ? c.owner : "nisenonamae";
  document.getElementById("c-repo").value = c ? c.repo : "notion-daily";
  document.getElementById("c-branch").value = c ? (c.branch || "main") : "main";
  document.getElementById("c-token").value = c ? c.token : "";
  const cache = lsGet(KEY_CACHE, null);
  state.doc = cache && cache.doc ? Object.assign(emptyDoc(), cache.doc) : emptyDoc(); state.sha = cache ? cache.sha : null;
  render();
  if (c && c.token) { state.conn = c; load(); }
  requestAnimationFrame(previewLoop);
}
window.__tn = { figureSvg, state, BUILTIN, poseAt, plant, place, joints, togglePin, buildSegs, tickPlayer, goSeg, menuSec, dragTo };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>

<style>

<script>
(function(){
"use strict";
const APP_VERSION = "2026-10-07 r5";
const DATA = "roadmap/apps/tanren/data.json";
const KEY_CONN = "tn-conn", KEY_CACHE = "tn-cache", KEY_VOICE = "tn-voice";
const state = { conn: null, doc: null, sha: null, view: "menus", editMenu: null, picker: false, editMove: null, frame: 0, preview: true, play: null };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => window.__tnToday || new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);
const nowMs = () => window.__tnNow ? window.__tnNow() : performance.now();
const say = (t, err) => { const el = document.getElementById("msg"); el.textContent = t; el.classList.toggle("err", !!err); };
const emptyDoc = () => ({ version: 1, moves: [], menus: [], runs: [] });

/* ───────── 人の骨組み(立体):骨ごとの向き(奥行きつき)で描き、カメラの向きから見た形にする ─────────
   世界の座標:x=右、y=上、z=手前。地面は y=0 */
const SEG = { torso: 51, neck: 12, head: 11, sh: 10, hip: 8, uarm: 33, farm: 30, thigh: 44, shin: 43, foot: 13 };
const BONES = [["M", "P", SEG.torso * 0.45], ["S", "M", SEG.torso * 0.55], ["H", "S", SEG.neck + SEG.head],
  ["L1", "S", SEG.sh], ["E1", "L1", SEG.uarm], ["W1", "E1", SEG.farm], ["L2", "S", SEG.sh], ["E2", "L2", SEG.uarm], ["W2", "E2", SEG.farm],
  ["Q1", "P", SEG.hip], ["K1", "Q1", SEG.thigh], ["A1", "K1", SEG.shin], ["T1", "A1", SEG.foot],
  ["Q2", "P", SEG.hip], ["K2", "Q2", SEG.thigh], ["A2", "K2", SEG.shin], ["T2", "A2", SEG.foot]];
const BONE = Object.fromEntries(BONES.map(b => [b[0], b]));
const GROUND = 212, W = 320, H = 240;
const R = x => x * Math.PI / 180;
const v3 = { add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], len: a => Math.hypot(a[0], a[1], a[2]), norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; } };
const clone = o => JSON.parse(JSON.stringify(o));
function joints(p){
  const j = { P: p.r.slice() };
  for (const [b, par, l] of BONES) j[b] = v3.add(j[par], v3.mul(p.d[b], l));
  return j;
}
// カメラ:yaw=縦の軸まわりに回す、pitch=上から見下ろす角度
const camOf = c => Object.assign({ yaw: 0, pitch: 0 }, c || {});
function toCam(pt, cam){
  const y0 = R(cam.yaw), p0 = R(cam.pitch);
  const x1 = pt[0] * Math.cos(y0) + pt[2] * Math.sin(y0), z1 = -pt[0] * Math.sin(y0) + pt[2] * Math.cos(y0);
  return [x1, pt[1] * Math.cos(p0) - z1 * Math.sin(p0), pt[1] * Math.sin(p0) + z1 * Math.cos(p0)];       // [横, 上, 手前]
}
function fromCam(c, cam){
  const y0 = R(cam.yaw), p0 = R(cam.pitch);
  const y = c[1] * Math.cos(p0) + c[2] * Math.sin(p0), z1 = -c[1] * Math.sin(p0) + c[2] * Math.cos(p0);
  return [c[0] * Math.cos(y0) - z1 * Math.sin(y0), y, c[0] * Math.sin(y0) + z1 * Math.cos(y0)];
}
const groundY = cam => GROUND - 80 * Math.sin(R(cam.pitch));
function scr(pt, cam){ const c = toCam(pt, cam); return [W / 2 + c[0], groundY(cam) - c[1], c[2]]; }
// 足(または体の一番低いところ)を地面につける
function plant(p, how){
  const q = clone(p), j = joints(q), mode = (how && how.mode) || "feet";
  const pts = mode === "feet" ? [j.A1, j.A2, j.T1, j.T2] : Object.values(j);
  q.r[1] -= Math.min.apply(null, pts.map(x => x[1]));
  if (how && how.ax != null) q.r[0] += how.ax - joints(q).A1[0];
  if (how && how.px != null) q.r[0] = how.px;
  if (q.lift) q.r[1] += q.lift;
  return q;
}
// 腕・脚の先を決めた点に届かせる(ひざ・ひじは今の向きの側に曲げる)
const LIMB = { W1: ["L1", "E1", "W1"], W2: ["L2", "E2", "W2"], A1: ["Q1", "K1", "A1"], A2: ["Q2", "K2", "A2"] };
function ikTo(p, key, T){
  const L = LIMB[key]; if (!L) return p;
  const q = clone(p), j = joints(q), Rt = j[L[0]], Mi = j[L[1]], l1 = BONE[L[1]][2], l2 = BONE[L[2]][2];
  const toT = v3.sub(T, Rt), d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(l1 + l2 - 0.01, v3.len(toT))), u = v3.norm(toT);
  let pole = v3.sub(Mi, Rt); pole = v3.sub(pole, v3.mul(u, v3.dot(pole, u)));
  if (v3.len(pole) < 1e-6) pole = Math.abs(u[1]) < 0.9 ? v3.sub([0, 1, 0], v3.mul(u, u[1])) : v3.sub([0, 0, 1], v3.mul(u, u[2]));
  pole = v3.norm(pole);
  const a = (l1 * l1 + d * d - l2 * l2) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mid = v3.add(Rt, v3.add(v3.mul(u, a), v3.mul(pole, h)));
  q.d[L[1]] = v3.norm(v3.sub(mid, Rt)); q.d[L[2]] = v3.norm(v3.sub(T, mid));
  return q;
}
// どの関節をいくつ固定しても合うように:骨の長さを保ったまま、固定した関節を決めた場所へ少しずつ寄せる
const EXTRA = [["L1", "L2", SEG.sh * 2], ["Q1", "Q2", SEG.hip * 2]];       // 肩の線・腰の線はまっすぐのまま
function solvePins(q, pins){
  const pos = joints(q), fixed = new Set(Object.keys(pins));
  Object.keys(pins).forEach(k => { pos[k] = pins[k].slice(); });
  const cons = BONES.map(([b, par, l]) => [par, b, l]).concat(EXTRA);
  for (let it = 0; it < 80; it++) {
    for (const [a, b, l] of cons) {
      const wa = fixed.has(a) ? 0 : 1, wb = fixed.has(b) ? 0 : 1; if (!wa && !wb) continue;
      const dv = v3.sub(pos[b], pos[a]), dist = v3.len(dv) || 1e-6, k = (dist - l) / dist;
      pos[a] = v3.add(pos[a], v3.mul(dv, k * wa / (wa + wb))); pos[b] = v3.sub(pos[b], v3.mul(dv, k * wb / (wa + wb)));
    }
  }
  const o = clone(q); o.r = pos.P.slice();
  for (const [b, par] of BONES) { const dv = v3.sub(pos[b], pos[par]); if (v3.len(dv) > 1e-6) o.d[b] = v3.norm(dv); }
  return o;
}
function place(p, move){
  const pins = move.pins || {}, keys = Object.keys(pins);
  if (!keys.length) return plant(p, move.plant);
  let q = clone(p); const j = joints(q);
  q.r = v3.add(q.r, v3.sub(pins[keys[0]], j[keys[0]]));                    // 1つ目の固定に合わせて体全体をずらす
  const rest = keys.slice(1);
  if (rest.some(k => !LIMB[k])) q = solvePins(q, pins);                       // 手首・足首以外も固定しているとき
  rest.filter(k => LIMB[k]).forEach(k => { q = ikTo(q, k, pins[k]); });     // 手首・足首は最後にぴったり届かせる
  return q;
}
// 置く物(立体の箱の集まりとして描く)
const PROPS = { chair: "椅子", box: "台", wall: "壁", mat: "マット", bar: "棒" };
function propBoxes(o){
  const x = o.x, y = o.y, z = o.z || 0, w = o.w || 50, h = o.h || 40, d = o.d || 44, z0 = z - d / 2, z1 = z + d / 2;
  const box = (xa, xb, ya, yb, za, zb) => [xa, xb, ya, yb, za, zb];
  if (o.type === "chair") return [box(x, x + w, y - 5, y, z0, z1), box(x, x + 5, y, y + h, z0, z1), box(x, x + 4, 0, y - 5, z0, z0 + 4), box(x + w - 4, x + w, 0, y - 5, z0, z0 + 4), box(x, x + 4, 0, y - 5, z1 - 4, z1), box(x + w - 4, x + w, 0, y - 5, z1 - 4, z1)];
  if (o.type === "box") return [box(x, x + w, 0, y, z0, z1)];
  if (o.type === "wall") return [box(x, x + (o.w || 10), 0, 220, -110, 110)];
  if (o.type === "mat") return [box(x, x + w, 0, 3, z - (o.d || 60) / 2, z + (o.d || 60) / 2)];
  if (o.type === "bar") return [box(x, x + w, y, y + 4, z - 2, z + 2)];
  return [];
}
function hull(ps){
  ps = ps.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]), lo = [], up = [];
  for (const p of ps) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of ps.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function boxSvg(b, cam, cls){
  const pts = []; for (const x of [b[0], b[1]]) for (const y of [b[2], b[3]]) for (const z of [b[4], b[5]]) pts.push(scr([x, y, z], cam));
  return '<polygon class="' + cls + '" points="' + hull(pts).map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '"/>';
}
const propSvg = (o, cam) => '<g class="prop">' + propBoxes(o).map(b => boxSvg(b, cam, "pbox")).join("") + "</g>";
function propAnchor(o){ return [o.x, o.type === "wall" ? 100 : o.type === "mat" ? 2 : o.y, o.z || 0]; }
const HANDLES = ["P", "M", "S", "H", "E1", "W1", "E2", "W2", "K1", "A1", "K2", "A2", "T1", "T2", "L1", "L2", "Q1", "Q2"];
const SHOWN = ["P", "M", "S", "H", "L2", "Q2", "E1", "W1", "E2", "W2", "K1", "A1", "K2", "A2", "T1", "T2"];      // 肩・腰の線のつまみは片側だけ(反対側も一緒に回る)
const KNOB = 26;     // 肩・股の線を回すつまみは、付け根からこの長さの所に出す
const knobPos = (p, j, k) => /^[LQ]/.test(k) ? v3.add(j[BONE[k][1]], v3.mul(p.d[k], KNOB)) : j[k];
// 前を向いているか後ろかが分かるように、頭に目を描く(1=右半身。前 = 上向き × 右)
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function facing(p){
  const up = p.d.H, rt = p.d.L1;
  let f = cross(up, rt); if (v3.len(f) < 0.2) f = cross(v3.norm(v3.add(p.d.M, p.d.S)), rt);
  return { f: v3.norm(f), up: v3.norm(up), rt: v3.norm(v3.sub(rt, v3.mul(v3.norm(up), v3.dot(rt, v3.norm(up))))) };
}
function eyesSvg(p, j, cam){
  const fc = facing(p), r = SEG.head, c0 = toCam(j.H, cam);
  return [1, -1].map(sd => {
    const e = v3.add(j.H, v3.add(v3.mul(fc.f, r * 0.62), v3.add(v3.mul(fc.rt, sd * r * 0.42), v3.mul(fc.up, r * 0.12))));
    const ec = toCam(e, cam); if (ec[2] <= c0[2] + 0.5) return "";
    const q = scr(e, cam); return '<circle class="eye" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2.4"/>';
  }).join("");

const JNAME = { P: "腰", M: "腰の上", S: "胸", H: "頭", L1: "右肩", L2: "左肩", Q1: "右股", Q2: "左股", E1: "右ひじ", W1: "右手首", E2: "左ひじ", W2: "左手首", K1: "右ひざ", A1: "右足首", K2: "左ひざ", A2: "左足首", T1: "右つま先", T2: "左つま先" };

/* ───────── 再生 ───────── */
function buildSegs(mn){
  const segs = [], its = mn.items.filter(it => moveOf(it.move));
  if (!its.length) return segs;
  segs.push({ kind: "prep", dur: 5, next: its[0] });
  its.forEach((it, i) => {
    for (let s = 1; s <= it.sets; s++) {
      segs.push({ kind: "move", it, set: s, dur: itemSec(it) });
      const lastAll = i === its.length - 1 && s === it.sets;
      const nextIt = s < it.sets ? it : its[i + 1];
      if (!lastAll && (it.rest || 0) > 0) segs.push({ kind: "rest", dur: it.rest, next: nextIt, nextSet: s < it.sets ? s + 1 : 1 });
    }
  });

}
function startPlay(mn){
  const segs = buildSegs(mn); if (!segs.length) return say("このメニューには動作がありません。", true);
  state.play = { mn, segs, i: 0, start: nowMs(), paused: null, total: segs.reduce((a, x) => a + x.dur, 0), said: {} };
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { state.play && (state.play.lock = l); }).catch(() => {}); } catch (e) {}

}
function segName(seg){ const m = moveOf((seg.kind === "move" ? seg.it : seg.next).move); return m ? m.name : ""; }
function enterSeg(){
  const pl = state.play, seg = pl.segs[pl.i]; pl.said = {};

  else if (seg.kind === "move") speak(segName(seg) + "、" + seg.it.value + (seg.it.mode === "reps" ? "回" : "秒") + (seg.it.sets > 1 ? "、" + seg.set + "セット目" : ""));
  else speak("休憩、" + seg.dur + "秒。次は" + segName(seg));
  renderPlayer();
}
function elapsed(){ const pl = state.play; return ((pl.paused != null ? pl.paused : nowMs()) - pl.start) / 1000; }
function renderPlayer(){
  const pl = state.play, el = document.getElementById("player"); if (!pl) { el.hidden = true; el.innerHTML = ""; return; }
  if (pl.done) {
    el.className = "player"; el.innerHTML = '<div class="stage"><div class="now"><div class="nm">おつかれさまでした</div><div class="sub2">' + esc(pl.mn.name) + "・" + fmt(pl.total) + '</div></div></div><div class="ctl"><button type="button" class="main" data-pl="close" aria-label="閉じる">✓</button></div>';
    return;
  }

  el.className = "player" + (seg.kind !== "move" ? " rest" : "");
  const nxt = pl.segs.slice(pl.i + 1).find(x => x.kind === "move");
  el.innerHTML = '<div class="top"><span>' + esc(pl.mn.name) + "</span><span>" + (pl.i + 1) + " / " + pl.segs.length + "</span></div>" +
    '<div class="stage" id="pl-stage">' + figureSvg(poseAt(m, 0), m.cam, { id: "pl-fig", props: m.props, fit: fitOf(m) }) + "</div>" +
    '<div class="now"><div class="nm">' + (seg.kind === "prep" ? "準備" : seg.kind === "rest" ? "休憩" : esc(m.name)) + "</div>" +
    '<div class="big" id="pl-big"></div><div class="sub2" id="pl-sub"></div><div class="bar"><i id="pl-bar" style="width:0%"></i></div>' +
    '<div class="sub2">' + (seg.kind === "move" ? (nxt ? "次:" + esc(segName(nxt)) : "これで最後") : "次:" + esc(m.name) + (seg.kind === "rest" && seg.nextSet > 1 ? "(" + seg.nextSet + "セット目)" : "")) + "</div></div>" +
    '<div class="ctl"><button type="button" data-pl="prev" aria-label="前へ">⏮</button><button type="button" class="main" data-pl="pause" aria-label="一時停止">' + (pl.paused != null ? "▶" : "⏸") + '</button><button type="button" data-pl="next" aria-label="次へ">⏭</button><button type="button" data-pl="stop" aria-label="やめる">✕</button></div>';

}
function tickPlayer(){
  const pl = state.play; if (!pl || pl.done) return;
  const seg = pl.segs[pl.i], t = elapsed(), m = moveOf((seg.kind === "move" ? seg.it : seg.next).move);
  const fig = document.getElementById("pl-stage");
  if (fig) fig.innerHTML = figureSvg(poseAt(m, seg.kind === "move" && !m.hold ? t / m.sec : (seg.kind === "move" ? 0 : t / (m.sec * 1.6))), m.cam, { id: "pl-fig", props: m.props, fit: m.__fit || (m.__fit = fitOf(m)) });
  const left = seg.dur - t, big = document.getElementById("pl-big"), sub = document.getElementById("pl-sub"), bar = document.getElementById("pl-bar");

    if (rem === 3 && seg.it.value > 3 && !pl.said.r3) { pl.said.r3 = true; speak("あと3回"); }
  } else {
    if (big) big.textContent = fmt(Math.ceil(left)); if (sub) sub.textContent = seg.kind === "move" && seg.it.sets > 1 ? seg.set + "/" + seg.it.sets + "セット" : "";

function goSeg(i){

    commit(doc => { doc.runs = (doc.runs || []).concat([{ menu: pl.mn.id, date: today(), sec: Math.round(pl.total) }]).slice(-200); }); return; }

function releaseLock(){ try { state.play && state.play.lock && state.play.lock.release(); } catch (e) {} }

/* ───────── 動作を作る画面のアニメーションとドラッグ ───────── */
function previewLoop(ts){

function svgPoint(svg, ev){ const pt = svg.createSVGPoint ? svg.createSVGPoint() : { x: 0, y: 0 }; pt.x = ev.clientX; pt.y = ev.clientY; const m = svg.getScreenCTM && svg.getScreenCTM(); const r = m && pt.matrixTransform ? pt.matrixTransform(m.inverse()) : pt; return [r.x, r.y]; }
function dragTo(jk, pt){
  const m = state.editMove, fr = m.frames[state.frame], cam = camOf(m.cam), j = joints(place(fr, m));
  const sc = w => { const c = toCam(w, cam); return [W / 2 + c[0], groundY(cam) - c[1], c[2]]; };
  if (m.pins && m.pins[jk]) { const c = toCam(m.pins[jk], cam), s0 = sc(m.pins[jk]); m.pins[jk] = fromCam([c[0] + pt[0] - s0[0], c[1] - (pt[1] - s0[1]), c[2]], cam); return; }   // 固定した関節は、固定する場所が動く
  if (jk === "P") { const s0 = sc(j.P); fr.r = v3.add(fr.r, fromCam([pt[0] - s0[0], -(pt[1] - s0[1]), 0], cam)); return; }
  const [, par] = BONE[jk], knob = /^[LQ]/.test(jk), len = knob ? KNOB : BONE[jk][2], pc = sc(j[par]), cc = sc(knob ? knobPos(place(fr, m), j, jk) : j[jk]);

  fr.d[jk] = v3.norm(fromCam([dx / len, dup / len, dz / len], cam));
  if (jk === "L1" || jk === "L2" || jk === "Q1" || jk === "Q2") { const o = { L1: "L2", L2: "L1", Q1: "Q2", Q2: "Q1" }[jk]; fr.d[o] = v3.mul(fr.d[jk], -1); }   // 肩の線・腰の線はまっすぐのまま回る
}
function togglePin(jk){

/* ───────── 描画と操作 ───────── */
function render(){ if (!D()) state.doc = emptyDoc(); renderMenus(); renderMoves(); }

    if ((b = q("[data-idown]"))) { const i = +b.dataset.idown; if (i < mn.items.length - 1) [mn.items[i + 1], mn.items[i]] = [mn.items[i], mn.items[i + 1]]; return renderMenus(); }
